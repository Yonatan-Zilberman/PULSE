<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PULSE Phase 0 Feasibility Gate — Blind Human Rating Tool</title>
  <style>
    :root {
      --bg-primary: #0a0e17;
      --bg-surface: #131b2e;
      --bg-card: #1e293b;
      --bg-card-hover: #27354f;
      --border-color: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-primary: #6366f1;
      --accent-hover: #4f46e5;
      --accent-success: #10b981;
      --accent-warning: #f59e0b;
      --accent-danger: #ef4444;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px;
    }

    header {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(19, 27, 46, 0.9));
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px 28px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      box-shadow: var(--shadow-card);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-badge {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 20px;
      color: #ffffff;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
    }

    .brand-title h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand-title p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .input-group {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
    }

    .input-group label {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .input-group input {
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
    }

    button.btn {
      background: var(--accent-primary);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    button.btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    button.btn-secondary {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
    }

    button.btn-secondary:hover {
      background: var(--bg-card-hover);
    }

    /* Scoreboard */
    .scoreboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-card .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .stat-card .value {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .gate-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      width: fit-content;
    }

    .gate-pass {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-success);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .gate-fail {
      background: rgba(239, 68, 68, 0.15);
      color: var(--accent-danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    /* Main Container */
    main {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .transition-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 20px;
      transition: border-color 0.2s, transform 0.2s;
    }

    .transition-card:hover {
      border-color: #475569;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-number {
      background: var(--accent-primary);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .card-meta {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Audio Player */
    .player-row {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .play-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--accent-primary);
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: transform 0.1s;
    }

    .play-btn:hover {
      background: var(--accent-hover);
      transform: scale(1.05);
    }

    .scrubber {
      flex: 1;
      min-width: 150px;
      height: 6px;
      background: var(--border-color);
      border-radius: 3px;
      position: relative;
      cursor: pointer;
    }

    .progress {
      height: 100%;
      background: var(--accent-primary);
      border-radius: 3px;
      width: 0%;
    }

    .time-display {
      font-family: monospace;
      font-size: 12px;
      color: var(--text-secondary);
      min-width: 80px;
      text-align: right;
    }

    /* Rating Rubric Grid */
    .ratings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 14px;
    }

    .rating-field {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .rating-field label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      display: flex;
      justify-content: space-between;
    }

    .rating-options {
      display: flex;
      gap: 4px;
      justify-content: space-between;
    }

    .score-btn {
      flex: 1;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 5px 0;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .score-btn:hover {
      background: var(--bg-card-hover);
      color: var(--text-primary);
    }

    .score-btn.active {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: #fff;
    }

    .comment-field {
      width: 100%;
    }

    .comment-field textarea {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      padding: 8px 12px;
      font-size: 12px;
      resize: vertical;
      min-height: 48px;
      outline: none;
    }

    .comment-field textarea:focus {
      border-color: var(--accent-primary);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="logo-badge">P</div>
      <div class="brand-title">
        <h1>PULSE Blind Human-Rating Tool</h1>
        <p>Phase 0 Feasibility Gate (20-Transition Evaluation Rubric)</p>
      </div>
    </div>
    <div class="header-actions">
      <div class="input-group">
        <label for="evaluatorName">Evaluator:</label>
        <input type="text" id="evaluatorName" value="Human Listener 01">
      </div>
      <input type="file" id="reportFileInput" accept=".json" style="display: none;">
      <button class="btn btn-secondary" onclick="document.getElementById('reportFileInput').click()">📁 Load Set Report</button>
      <button class="btn btn-secondary" onclick="loadDefaultTemplate()">⚡ Load Demo 20</button>
      <button class="btn" onclick="exportResultsJson()">💾 Export Results JSON</button>
    </div>
  </header>

  <div class="scoreboard">
    <div class="stat-card">
      <span class="label">Evaluated Progress</span>
      <span class="value" id="progressStat">0 / 20</span>
    </div>
    <div class="stat-card">
      <span class="label">Mean Convincingness</span>
      <span class="value" id="meanConvincingStat">0.00 / 5.0</span>
    </div>
    <div class="stat-card">
      <span class="label">Beat & Tempo Sync</span>
      <span class="value" id="meanBeatStat">0.00 / 5.0</span>
    </div>
    <div class="stat-card">
      <span class="label">Bass Handoff Score</span>
      <span class="value" id="meanBassStat">0.00 / 5.0</span>
    </div>
    <div class="stat-card">
      <span class="label">Phase 0 Gate Status</span>
      <span class="gate-badge gate-fail" id="gateStatusBadge">PENDING (Req: ≥4.0)</span>
    </div>
  </div>

  <main id="transitionsList">
    <!-- Populated by JS -->
  </main>

  <script>
    let transitionData = [];
    let audioElements = [];

    function initEmptySet(count = 20) {
      transitionData = [];
      for (let i = 1; i <= count; ++i) {
        const pad = i < 10 ? '0' + i : i;
        transitionData.push({
          id: i,
          title: `Transition ${pad}`,
          snippetUrl: `../audio/transitions/transition_${pad}.wav`,
          duration: "16.0s (8 bars)",
          strategy: "bass_swap",
          scores: {
            beat: 5,
            bass: 5,
            phrase: 5,
            energy: 5,
            convincing: 5
          },
          comments: ""
        });
      }
      renderCards();
      updateStats();
    }

    function renderCards() {
      const container = document.getElementById('transitionsList');
      container.innerHTML = '';
      audioElements = [];

      transitionData.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'transition-card';
        card.innerHTML = `
          <div class="card-header">
            <div class="card-title">
              <span class="card-number">#${item.id}</span>
              <strong>${item.title}</strong>
              <span class="card-meta">• Strategy: ${item.strategy} • Window: ${item.duration}</span>
            </div>
            <div class="card-meta">
              Snippet: <code>${item.snippetUrl.split('/').pop()}</code>
            </div>
          </div>

          <div class="player-row">
            <button class="play-btn" id="playBtn_${index}" onclick="toggleAudio(${index})">▶</button>
            <div class="scrubber" id="scrubber_${index}" onclick="seekAudio(${index}, event)">
              <div class="progress" id="progress_${index}"></div>
            </div>
            <div class="time-display" id="time_${index}">0:00 / 0:00</div>
          </div>

          <div class="ratings-grid">
            ${renderRatingField(index, 'beat', '1. Beat & Tempo Coherence', item.scores.beat)}
            ${renderRatingField(index, 'bass', '2. Low-End / Bass Swap', item.scores.bass)}
            ${renderRatingField(index, 'phrase', '3. Phrase Alignment', item.scores.phrase)}
            ${renderRatingField(index, 'energy', '4. Energy Continuity', item.scores.energy)}
            ${renderRatingField(index, 'convincing', '5. Human Convincingness', item.scores.convincing)}
          </div>

          <div class="comment-field">
            <textarea placeholder="Optional evaluator feedback notes on musicality, transitions, or anomalies..." onchange="updateComment(${index}, this.value)">${item.comments}</textarea>
          </div>
        `;
        container.appendChild(card);

        // Setup audio element
        const audio = new Audio(item.snippetUrl);
        audio.addEventListener('timeupdate', () => updateAudioProgress(index));
        audio.addEventListener('ended', () => onAudioEnded(index));
        audio.addEventListener('loadedmetadata', () => updateAudioDuration(index));
        audioElements.push(audio);
      });
    }

    function renderRatingField(transIdx, fieldKey, label, currentVal) {
      let btns = '';
      for (let s = 1; s <= 5; ++s) {
        const active = s === currentVal ? 'active' : '';
        btns += `<button class="score-btn ${active}" onclick="setScore(${transIdx}, '${fieldKey}', ${s})">${s}</button>`;
      }
      return `
        <div class="rating-field">
          <label><span>${label}</span> <span>${currentVal}/5</span></label>
          <div class="rating-options">${btns}</div>
        </div>
      `;
    }

    function setScore(transIdx, fieldKey, score) {
      transitionData[transIdx].scores[fieldKey] = score;
      renderCards();
      updateStats();
    }

    function updateComment(transIdx, val) {
      transitionData[transIdx].comments = val;
    }

    function toggleAudio(index) {
      const audio = audioElements[index];
      const btn = document.getElementById(`playBtn_${index}`);
      if (audio.paused) {
        // Pause all other audio
        audioElements.forEach((a, i) => {
          if (i !== index && !a.paused) {
            a.pause();
            document.getElementById(`playBtn_${i}`).innerText = '▶';
          }
        });
        audio.play().catch(e => console.log("Audio playback:", e));
        btn.innerText = '⏸';
      } else {
        audio.pause();
        btn.innerText = '▶';
      }
    }

    function updateAudioProgress(index) {
      const audio = audioElements[index];
      const prog = document.getElementById(`progress_${index}`);
      const time = document.getElementById(`time_${index}`);
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        prog.style.width = pct + '%';
        time.innerText = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
      }
    }

    function updateAudioDuration(index) {
      const audio = audioElements[index];
      const time = document.getElementById(`time_${index}`);
      if (audio.duration) {
        time.innerText = `0:00 / ${formatTime(audio.duration)}`;
      }
    }

    function onAudioEnded(index) {
      document.getElementById(`playBtn_${index}`).innerText = '▶';
      document.getElementById(`progress_${index}`).style.width = '0%';
    }

    function seekAudio(index, event) {
      const audio = audioElements[index];
      const scrubber = document.getElementById(`scrubber_${index}`);
      const rect = scrubber.getBoundingClientRect();
      const pos = (event.clientX - rect.left) / rect.width;
      if (audio.duration) {
        audio.currentTime = pos * audio.duration;
      }
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' + s : s}`;
    }

    function updateStats() {
      if (!transitionData.length) return;
      let sumConvincing = 0, sumBeat = 0, sumBass = 0;
      transitionData.forEach(t => {
        sumConvincing += t.scores.convincing;
        sumBeat += t.scores.beat;
        sumBass += t.scores.bass;
      });

      const avgConv = sumConvincing / transitionData.length;
      const avgBeat = sumBeat / transitionData.length;
      const avgBass = sumBass / transitionData.length;

      document.getElementById('progressStat').innerText = `${transitionData.length} / ${transitionData.length}`;
      document.getElementById('meanConvincingStat').innerText = `${avgConv.toFixed(2)} / 5.0`;
      document.getElementById('meanBeatStat').innerText = `${avgBeat.toFixed(2)} / 5.0`;
      document.getElementById('meanBassStat').innerText = `${avgBass.toFixed(2)} / 5.0`;

      const gateBadge = document.getElementById('gateStatusBadge');
      if (avgConv >= 4.0 && transitionData.length >= 20) {
        gateBadge.className = 'gate-badge gate-pass';
        gateBadge.innerText = 'PASS (Gate Verified)';
      } else {
        gateBadge.className = 'gate-badge gate-fail';
        gateBadge.innerText = 'FAIL (< 4.0 Avg)';
      }
    }

    function loadDefaultTemplate() {
      initEmptySet(20);
    }

    function exportResultsJson() {
      const evaluator = document.getElementById('evaluatorName').value || "Human Listener";
      let sumConvincing = 0, sumBeat = 0, sumBass = 0, sumPhrase = 0, sumEnergy = 0;
      transitionData.forEach(t => {
        sumConvincing += t.scores.convincing;
        sumBeat += t.scores.beat;
        sumBass += t.scores.bass;
        sumPhrase += t.scores.phrase;
        sumEnergy += t.scores.energy;
      });

      const total = transitionData.length;
      const exportObj = {
        evaluation_metadata: {
          evaluator_name: evaluator,
          evaluation_date: new Date().toISOString().split('T')[0],
          set_id: "pulse-phase0-eval-001",
          total_transitions_evaluated: total,
          target_gate_score: 4.0,
          pass_status: (sumConvincing / total >= 4.0) ? "PASS" : "FAIL"
        },
        ratings: transitionData.map(t => ({
          transition_id: t.id,
          blinded_label: t.title,
          snippet_file: t.snippetUrl,
          scores: {
            beat_coherence: t.scores.beat,
            bass_management: t.scores.bass,
            phrase_placement: t.scores.phrase,
            energy_flow: t.scores.energy,
            overall_convincingness: t.scores.convincing
          },
          pass_fail: t.scores.convincing >= 3 ? "PASS" : "FAIL",
          comments: t.comments
        })),
        aggregate_results: {
          mean_beat_coherence: +(sumBeat / total).toFixed(2),
          mean_bass_management: +(sumBass / total).toFixed(2),
          mean_phrase_placement: +(sumPhrase / total).toFixed(2),
          mean_energy_flow: +(sumEnergy / total).toFixed(2),
          mean_convincingness: +(sumConvincing / total).toFixed(2),
          total_pass_count: transitionData.filter(t => t.scores.convincing >= 3).length,
          total_fail_count: transitionData.filter(t => t.scores.convincing < 3).length,
          phase0_gate_passed: (sumConvincing / total >= 4.0 && total >= 20)
        }
      };

      const blob = new Blob([JSON.stringify(exportObj, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `evaluation_results_${evaluator.toLowerCase().replace(/\s+/g, '_')}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // Handle Report File Input Load
    document.getElementById('reportFileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const report = JSON.parse(evt.target.result);
          if (report.transitions && Array.isArray(report.transitions)) {
            transitionData = report.transitions.map((t, idx) => ({
              id: t.transition_index || (idx + 1),
              title: `Transition ${(t.transition_index || (idx + 1)) < 10 ? '0' + (t.transition_index || (idx + 1)) : (t.transition_index || (idx + 1))}`,
              snippetUrl: t.snippet_file || `../audio/transitions/transition_${(idx + 1) < 10 ? '0' + (idx + 1) : (idx + 1)}.wav`,
              duration: `${t.timeline ? t.timeline.duration_seconds : 16.0}s (${t.timeline ? t.timeline.duration_bars : 8} bars)`,
              strategy: t.eq_execution ? t.eq_execution.strategy : "bass_swap",
              scores: { beat: 5, bass: 5, phrase: 5, energy: 5, convincing: 5 },
              comments: ""
            }));
            renderCards();
            updateStats();
          }
        } catch (err) {
          alert("Error parsing report JSON: " + err.message);
        }
      };
      reader.readAsText(file);
    });

    // Initialize with 20 items on load
    window.addEventListener('DOMContentLoaded', () => initEmptySet(20));
  </script>
</body>
</html>
